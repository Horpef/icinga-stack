# HTTPS vhost for Icinga Web 2.
#
# The upstream image runs Apache as the unprivileged user `www-data`, so
# HTTPS listens on 8443 instead of 443 (see ports.conf). The application
# itself is mapped to "/" by conf-available/icingaweb2.conf, which is a
# global (server level) alias and therefore applies here as well.
<VirtualHost *:8443>
    ServerAdmin webmaster@localhost

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

    ErrorLog ${APACHE_LOG_DIR}/error-ssl.log
    CustomLog ${APACHE_LOG_DIR}/access-ssl.log combined
</VirtualHost>
