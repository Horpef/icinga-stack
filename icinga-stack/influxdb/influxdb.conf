# ---------------------------------------------------------------------------
# InfluxDB 1.8 -- config del servidor (generada con `influxd config` + 1 cambio)
# ---------------------------------------------------------------------------
# POR QUE ESTE FICHERO
#   El default de la imagen trae [data] wal-fsync-delay = "0s": un fsync a
#   disco en CADA escritura. Sobre el SSD SATA de esta maquina (Kingston SA400,
#   sin DRAM cache, con iowait medido del 46-75%) esos fsync acumulados
#   empujan algunos writes por encima de [coordinator] write-timeout = "10s"
#   y acaban en:
#
#       critical/InfluxdbWriter: Unexpected response code: Internal Server Error
#       [httpd] ... POST /write ... 500 ... 10000321   (10 s = timeout)
#       lvl=error msg="[500] - \"timeout\""
#
#   Icinga 2 NO reintenta esos points, asi que el 500 se traduce en HUECOS
#   intermitentes de metricas en Grafana. No es volumen: la BD pesa 68 MB y
#   ~160 series (verificado 2026-10-16); es latencia de E/S pura, el mismo
#   origen que el WARNING de load.
#
# EL UNICO CAMBIO respecto al default generado
#   [data] wal-fsync-delay:  "0s" -> "200ms"
#   Agrupa los fsync en tandas de 200 ms en vez de uno por escritura. Es el
#   ajuste recomendado para InfluxDB en discos lentos. Trade-off aceptado: en
#   un corte de luz se pierden hasta 200 ms de metricas (se regeneran solas).
#
#   OJO: en 1.8 la opcion se llama wal-fsync-delay, NO wal-fsync-interval (ese
#   era de versiones anteriores y escribirlo no hace nada).
#
# MONTAJE Y CAMBIOS
#   Sobre /etc/influxdb/influxdb.conf (el path que la imagen ya espera).
#   Tras tocarlo hay que recrear (no basta restart):
#       docker compose up -d --force-recreate influxdb
# ---------------------------------------------------------------------------

reporting-disabled = false
bind-address = "127.0.0.1:8088"

[meta]
  dir = "/var/lib/influxdb/meta"
  retention-autocreate = true
  logging-enabled = true

[data]
  dir = "/var/lib/influxdb/data"
  index-version = "inmem"
  wal-dir = "/var/lib/influxdb/wal"
  # EL CAMBIO (ver cabecera): fsync en tandas de 200 ms en vez de en cada
  # escritura. En 1.8 la opcion se llama wal-fsync-delay (NO wal-fsync-interval,
  # que era de versiones anteriores). 0s = inmediato = el default que causaba
  # los timeouts de escritura sobre el SSD lento de esta maquina.
  wal-fsync-delay = "200ms"
  validate-keys = false
  strict-error-handling = false
  query-log-enabled = true
  cache-max-memory-size = 1073741824
  cache-snapshot-memory-size = 26214400
  cache-snapshot-write-cold-duration = "10m0s"
  compact-full-write-cold-duration = "4h0m0s"
  compact-throughput = 50331648
  compact-throughput-burst = 50331648
  max-series-per-database = 1000000
  max-values-per-tag = 100000
  max-concurrent-compactions = 0
  max-index-log-file-size = 1048576
  series-id-set-cache-size = 100
  series-file-max-concurrent-snapshot-compactions = 0
  trace-logging-enabled = false
  tsm-use-madv-willneed = false

[coordinator]
  write-timeout = "10s"
  max-concurrent-queries = 0
  query-timeout = "0s"
  log-queries-after = "0s"
  max-select-point = 0
  max-select-series = 0
  max-select-buckets = 0

[retention]
  enabled = true
  check-interval = "30m0s"

[shard-precreation]
  enabled = true
  check-interval = "10m0s"
  advance-period = "30m0s"

[monitor]
  store-enabled = true
  store-database = "_internal"
  store-interval = "10s"

[subscriber]
  enabled = true
  http-timeout = "30s"
  insecure-skip-verify = false
  ca-certs = ""
  write-concurrency = 40
  write-buffer-size = 1000

[http]
  enabled = true
  bind-address = ":8086"
  auth-enabled = false
  log-enabled = true
  suppress-write-log = false
  write-tracing = false
  flux-enabled = false
  flux-log-enabled = false
  pprof-enabled = true
  pprof-auth-enabled = false
  debug-pprof-enabled = false
  ping-auth-enabled = false
  prom-read-auth-enabled = false
  https-enabled = false
  https-certificate = "/etc/ssl/influxdb.pem"
  https-private-key = ""
  max-row-limit = 0
  max-connection-limit = 0
  shared-secret = ""
  realm = "InfluxDB"
  unix-socket-enabled = false
  unix-socket-permissions = "0777"
  bind-socket = "/var/run/influxdb.sock"
  max-body-size = 25000000
  access-log-path = ""
  max-concurrent-write-limit = 0
  max-enqueued-write-limit = 0
  enqueued-write-timeout = 30000000000

[logging]
  format = "auto"
  level = "info"
  suppress-logo = false

[[graphite]]
  enabled = false
  bind-address = ":2003"
  database = "graphite"
  retention-policy = ""
  protocol = "tcp"
  batch-size = 5000
  batch-pending = 10
  batch-timeout = "1s"
  consistency-level = "one"
  separator = "."
  udp-read-buffer = 0

[[collectd]]
  enabled = false
  bind-address = ":25826"
  database = "collectd"
  retention-policy = ""
  batch-size = 5000
  batch-pending = 10
  batch-timeout = "10s"
  read-buffer = 0
  typesdb = "/usr/share/collectd/types.db"
  security-level = "none"
  auth-file = "/etc/collectd/auth_file"
  parse-multivalue-plugin = "split"

[[opentsdb]]
  enabled = false
  bind-address = ":4242"
  database = "opentsdb"
  retention-policy = ""
  consistency-level = "one"
  tls-enabled = false
  certificate = "/etc/ssl/influxdb.pem"
  batch-size = 1000
  batch-pending = 5
  batch-timeout = "1s"
  log-point-errors = true

[[udp]]
  enabled = false
  bind-address = ":8089"
  database = "udp"
  retention-policy = ""
  batch-size = 5000
  batch-pending = 10
  read-buffer = 0
  batch-timeout = "1s"
  precision = ""

[continuous_queries]
  log-enabled = true
  enabled = true
  query-stats-enabled = false
  run-interval = "1s"

[tls]
  min-version = ""
  max-version = ""

