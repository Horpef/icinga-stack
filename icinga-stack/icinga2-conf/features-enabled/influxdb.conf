/**
 * InfluxdbWriter - envia el performance data de cada check a InfluxDB 1.8
 * (API HTTP v1) para que Grafana pueda graficarlo.
 *
 * Esquema resultante (los templates por defecto del writer, sin sobrescribir):
 *   measurement = <check_command>        ej: load, disk, http, ping4, tcp, mysql
 *   tags        = hostname=<host name>, [service=<service name>]
 *   fields      = cada metrica del perfdata (load1, time, rta, ... )
 *
 * El nombre de la base de datos la crea el propio contenedor de InfluxDB en
 * su primer arranque a traves de INFLUXDB_DB=icinga2 (docker-compose.yml).
 *
 * Bind-mounted a /etc/icinga2/features-enabled/influxdb.conf.
 */
object InfluxdbWriter "influxdb" {
  host = "influxdb"
  port = 8086
  database = "icinga2"

  # Enviar apenas haya un poco de datos y no esperar al limite: el trafico es
  # minimo y asi los graficos de Grafana se actualizan casi en vivo.
  flush_threshold = 128
  flush_interval = 5s
}
