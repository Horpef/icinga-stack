/**
 * Icinga DB - feeds Redis with the configuration and current state of
 * Icinga 2. The `icingadb` daemon container picks it up from Redis and
 * writes it into the `icingadb` MySQL database, which is what Icinga DB Web
 * (the `icingadb` Icinga Web module) reads.
 *
 * Bind-mounted to /etc/icinga2/features-enabled/icingadb.conf.
 */
object IcingaDB "icingadb" {
  host = "redis"
  port = 6379
}
