/**
 * IDO (Icinga Data Objects) - legacy MySQL backend for Icinga 2.
 *
 * Kept enabled next to Icinga DB as requested. The schema lives in the
 * `icinga2` database (see mysql-init/03-ido-schema.sql).
 *
 * Bind-mounted to /etc/icinga2/features-enabled/ido-mysql.conf.
 */
object IdoMysqlConnection "ido-mysql" {
  host = "mariadb"
  port = 3306
  user = "icinga"
  password = "icinga_pass"
  database = "icinga2"
}
