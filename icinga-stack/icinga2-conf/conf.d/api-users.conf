/**
 * API user used by Icinga Web 2 (Icinga DB command transport) and by the
 * Director module.
 *
 * Bind-mounted to /etc/icinga2/conf.d/api-users-icingaweb.conf so it does
 * not clash with the `api-users.conf` generated by `icinga2 api setup`
 * (which contains the auto generated `root` ApiUser).
 */
object ApiUser "icingaweb" {
  password = "icingaweb123"

  permissions = [ "*" ]
}
