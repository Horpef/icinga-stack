/*
 * =========================================================================
 * Stack monitoring - Icinga 2 + MariaDB + Redis + Icinga DB + Icinga Web 2
 * =========================================================================
 * Bind-mounted over /etc/icinga2/conf.d/stack-monitoring.conf
 * (see docker-compose.yml).
 *
 * Every host carries `vars.stack_role`, which is used for the service apply
 * rules and for the hostgroups below. All checks run from the Icinga 2
 * container and only use check commands provided by the stock monitoring
 * plugins of the icinga/icinga2 image:
 *   ping4, ping6, disk, load, procs, swap, users, icinga, http, tcp,
 *   mysql, mysql_query
 *
 * The one exception is `backup_health` (bottom of this file): the stock
 * plugins answer about a *single* file or about a filesystem, while the
 * backup question is "which is the *newest* file in this folder". That
 * needs a script, so it lives in backup/check-backups.sh and is mounted
 * into PluginDir read-only. Everything else here is stock.
 *
 * The container itself (NodeName) is defined in conf.d/hosts.conf, which is
 * where the stock services (ping4, ping6, load, procs, swap, users, icinga,
 * disk) get assigned.
 */

// =========================================================================
// Hosts
// =========================================================================

/* MariaDB - compose service `mariadb`, container `icinga-db`. */
object Host "mariadb" {
  import "generic-host"

  display_name = "MariaDB Database"
  address = "mariadb"

  vars.stack_role = "database"

  vars.mysql_hostname = "mariadb"
  vars.mysql_port = 3306
  vars.mysql_username = "icinga"
  vars.mysql_password = "icinga_pass"
  vars.mysql_database = "icinga2"

  vars.mysql_query_hostname = "mariadb"
  vars.mysql_query_port = 3306
  vars.mysql_query_username = "icinga"
  vars.mysql_query_password = "icinga_pass"
  vars.mysql_query_database = "icinga2"

  vars.notification["mail"] = {
    groups = [ "icingaadmins" ]
  }
}

/* Redis - state cache of Icinga 2 (icingadb feature), Icinga DB and Icinga
   Web's real-time state. */
object Host "redis" {
  import "generic-host"

  display_name = "Redis (cache / Icinga DB)"
  address = "redis"

  vars.stack_role = "cache"

  vars.notification["mail"] = {
    groups = [ "icingaadmins" ]
  }
}

/* Icinga DB daemon - imports Icinga 2's config and state from Redis into
   the `icingadb` MySQL database.

   It publishes no listening port (6666, 8080, 8086, 9090 and 9981 are all
   closed when probed from monitoring-net) and the icinga/icingadb image is
   distroless: no sh, no curl, no wget, and its binary only offers --version,
   -c and --database-auto-import. That is why it carries no Docker
   healthcheck, and until "Icinga DB - Heartbeat" below existed a ping was
   the only thing watching it - enough to catch a container going down, but
   blind to a hung daemon, which is exactly the failure that would leave
   Icinga Web serving stale data with everything else looking green.

   The mysql_query vars are the connection used by that service. They are
   deliberately not the same database as MariaDB's own checks: those read
   icinga2 (the IDO schema), this one reads icingadb (Icinga DB's schema),
   over the same server. */
object Host "icingadb" {
  import "generic-host"

  display_name = "Icinga DB daemon"
  address = "icingadb"

  vars.stack_role = "icingadb"

  vars.mysql_query_hostname = "mariadb"
  vars.mysql_query_port = 3306
  vars.mysql_query_username = "icinga"
  vars.mysql_query_password = "icinga_pass"
  vars.mysql_query_database = "icingadb"

  vars.notification["mail"] = {
    groups = [ "icingaadmins" ]
  }
}

/* Icinga Web 2 */
object Host "icinga-web" {
  import "generic-host"

  display_name = "Icinga Web 2"
  address = "icinga-web"

  vars.stack_role = "web"

  vars.notification["mail"] = {
    groups = [ "icingaadmins" ]
  }
}

/* Mailpit - SMTP test server used by Icinga 2 for notification mails. */
object Host "mailpit" {
  import "generic-host"

  display_name = "Mailpit (SMTP test server)"
  address = "mailpit"

  vars.stack_role = "mail"

  vars.notification["mail"] = {
    groups = [ "icingaadmins" ]
  }
}

// =========================================================================
// Host groups
// =========================================================================

object HostGroup "stack-database" {
  display_name = "Stack - Database"
  assign where host.vars.stack_role == "database"
}

object HostGroup "stack-cache" {
  display_name = "Stack - Cache"
  assign where host.vars.stack_role == "cache"
}

object HostGroup "stack-monitoring" {
  display_name = "Stack - Monitoring"
  assign where host.vars.stack_role == "monitoring"
}

object HostGroup "stack-web" {
  display_name = "Stack - Web"
  assign where host.vars.stack_role == "web"
}

object HostGroup "stack-mail" {
  display_name = "Stack - Mail"
  assign where host.vars.stack_role == "mail"
}

object HostGroup "stack-all" {
  display_name = "Stack - All components"
  assign where host.vars.stack_role == "database" || host.vars.stack_role == "cache" || host.vars.stack_role == "monitoring" || host.vars.stack_role == "web" || host.vars.stack_role == "mail" || host.vars.stack_role == "icingadb" || host.vars.stack_role == "wazuh" || host.vars.stack_role == "oracle"
}

// =========================================================================
// Service apply rules - TCP port checks
// =========================================================================

apply Service "TCP - MariaDB" {
  import "generic-service"
  check_command = "tcp"
  vars.tcp_address = host.address
  vars.tcp_port = 3306
  assign where host.name == "mariadb"
}

apply Service "TCP - Redis" {
  import "generic-service"
  check_command = "tcp"
  vars.tcp_address = host.address
  vars.tcp_port = 6379
  assign where host.name == "redis"
}

apply Service "TCP - Icinga 2 API" {
  import "generic-service"
  check_command = "tcp"
  vars.tcp_address = host.address
  vars.tcp_port = 5665
  assign where host.name == NodeName
}

apply Service "TCP - Icinga Web 2 HTTP" {
  import "generic-service"
  check_command = "tcp"
  vars.tcp_address = host.address
  vars.tcp_port = 8080
  assign where host.name == "icinga-web"
}

apply Service "TCP - Icinga Web 2 HTTPS" {
  import "generic-service"
  check_command = "tcp"
  vars.tcp_address = host.address
  vars.tcp_port = 8443
  assign where host.name == "icinga-web"
}

apply Service "TCP - Mailpit SMTP" {
  import "generic-service"
  check_command = "tcp"
  vars.tcp_address = host.address
  vars.tcp_port = 1025
  assign where host.name == "mailpit"
}

// =========================================================================
// Service apply rules - HTTP checks
// =========================================================================

/* The login page issues a cookie check redirect (302) for every request
   without a session cookie, which is exactly what check_http sends. */
apply Service "Icinga Web 2 - Login page" {
  import "generic-service"
  check_command = "http"
  vars.http_uri = "/authentication/login"
  vars.http_port = 8080
  vars.http_expect = "302"
  assign where host.name == "icinga-web"
}

apply Service "Icinga Web 2 - Login page (HTTPS)" {
  import "generic-service"
  check_command = "http"
  vars.http_uri = "/authentication/login"
  vars.http_port = 8443
  vars.http_ssl = true
  vars.http_expect = "302"
  assign where host.name == "icinga-web"
}

apply Service "Mailpit - Web UI" {
  import "generic-service"
  check_command = "http"
  vars.http_uri = "/"
  vars.http_port = 8025
  vars.http_expect = "200"
  assign where host.name == "mailpit"
}

apply Service "Icinga 2 API" {
  import "generic-service"
  check_command = "http"
  vars.http_uri = "/v1/status"
  vars.http_port = 5665
  vars.http_ssl = true
  vars.http_expect = "200"
  vars.http_auth_pair = "icingaweb:icingaweb123"
  vars.http_timeout = 10
  assign where host.name == NodeName
}

// =========================================================================
// Service apply rules - MariaDB health
// =========================================================================

apply Service "MariaDB - Connection" {
  import "generic-service"
  check_command = "mysql"
  vars.mysql_hostname = host.vars.mysql_hostname
  vars.mysql_port = host.vars.mysql_port
  vars.mysql_username = host.vars.mysql_username
  vars.mysql_password = host.vars.mysql_password
  vars.mysql_database = host.vars.mysql_database
  assign where host.name == "mariadb"
}

apply Service "MariaDB - Uptime" {
  import "generic-service"
  check_command = "mysql_query"
  vars.mysql_query_hostname = host.vars.mysql_query_hostname
  vars.mysql_query_port = host.vars.mysql_query_port
  vars.mysql_query_username = host.vars.mysql_query_username
  vars.mysql_query_password = host.vars.mysql_query_password
  vars.mysql_query_database = host.vars.mysql_query_database
  vars.mysql_query_execute = "SELECT VARIABLE_VALUE FROM performance_schema.global_status WHERE VARIABLE_NAME='Uptime'"
  vars.mysql_query_warning = "60:"
  vars.mysql_query_critical = "30:"
  assign where host.name == "mariadb"
}

apply Service "MariaDB - Connection usage" {
  import "generic-service"
  check_command = "mysql_query"
  vars.mysql_query_hostname = host.vars.mysql_query_hostname
  vars.mysql_query_port = host.vars.mysql_query_port
  vars.mysql_query_username = host.vars.mysql_query_username
  vars.mysql_query_password = host.vars.mysql_query_password
  vars.mysql_query_database = host.vars.mysql_query_database
  vars.mysql_query_execute = "SELECT ROUND(100.0 * (SELECT VARIABLE_VALUE FROM performance_schema.global_status WHERE VARIABLE_NAME='Threads_connected') / (SELECT VARIABLE_VALUE FROM performance_schema.global_variables WHERE VARIABLE_NAME='Max_connections'))"
  vars.mysql_query_warning = "0:80"
  vars.mysql_query_critical = "0:95"
  assign where host.name == "mariadb"
}

// =========================================================================
// Service apply rules - Icinga DB health
// =========================================================================

/* The daemon has no port to probe and no health subcommand, so the only
   observable it owns is the one it keeps in its own database:
   `icingadb_instance.heartbeat`, refreshed on its own roughly every 70 s.

   The candidates that look more sophisticated are traps. Measured over 75 s
   of a perfectly healthy stack, host_state.last_update,
   service_state.last_update and state_history.event_time all aged by exactly
   75 s without moving: they only advance on a state *change*, not on every
   check, so they would go red during any quiet half hour. The heartbeat is
   the only one that keeps ticking by itself.

   The age is returned in seconds, and the thresholds are chosen against the
   real beat period (~70 s): 180 warns after three missed beats, 600 goes
   red. A single skipped beat stays silent, and because services here get 5
   attempts at 30 s, a freshly booted stack has 2.5 min before anything turns
   hard - more than Icinga DB needs to start beating again, so a machine
   coming up after a night off settles itself without notifying.

   COALESCE turns an empty table (Icinga DB never ran) into an age of ~1.7e9
   seconds rather than NULL, so it reports CRITICAL instead of UNKNOWN. */
apply Service "Icinga DB - Heartbeat" {
  import "generic-service"
  check_command = "mysql_query"
  vars.mysql_query_hostname = host.vars.mysql_query_hostname
  vars.mysql_query_port = host.vars.mysql_query_port
  vars.mysql_query_username = host.vars.mysql_query_username
  vars.mysql_query_password = host.vars.mysql_query_password
  vars.mysql_query_database = host.vars.mysql_query_database
  vars.mysql_query_execute = "SELECT FLOOR(UNIX_TIMESTAMP(NOW(3)) - COALESCE(MAX(heartbeat),0)/1000) FROM icingadb.icingadb_instance"
  vars.mysql_query_warning = "0:180"
  vars.mysql_query_critical = "0:600"
  assign where host.name == "icingadb"
}

// =========================================================================
// Service apply rules - Backups
// =========================================================================

/* One service per thing that has to keep working for a backup to be worth
   anything: the copy reaching the destination, the destination having
   room, the flat mirror of the project, the MySQL dump that is the raw
   material of every copy, and the scheduler that is supposed to start the
   whole thing unattended. All five run the same command with a different
   --test (see the header of backup/check-backups.sh).

   Threshold units differ on purpose: `*_warn`/`*_crit` are SECONDS for the
   four age tests and GIGABYTES for `espacio`, where the comparison is
   inverted (below the threshold is bad, hence warn > crit there only).

   The first four need the two read-only mounts on the `icinga2` service in
   docker-compose.yml (/backups and /staging): they have to look inside the
   destination, and Icinga could not see it otherwise. `programada` does
   not look at the filesystem at all -- it needs the DUP_USER/DUP_PASSWORD
   environment variables instead, because "did the scheduler fire" only
   exists as Schedule.LastRun in the Duplicati API. */
object CheckCommand "backup_health" {
  /* Launched through /bin/sh instead of relying on the execute bit, which
     is not guaranteed for a file bind-mounted from Windows. */
  command = [ "/bin/sh", PluginDir + "/check-backups.sh" ]

  arguments = {
    "--test" = {
      value = "$backup_test$"
      required = true
    }
    "--warn" = {
      value = "$backup_warn$"
      required = true
    }
    "--crit" = {
      value = "$backup_crit$"
      required = true
    }
  }
}

/* The newest `duplicati-*` file in the destination. The schedule runs
   daily at 03:00, so a healthy stack never goes more than ~24 h without
   writing one: 26 h = one missed run, 50 h = two. This is the check that
   turns "the backup stopped working" from something you discover during a
   disaster into a mail the next morning. */
apply Service "Backup - Last upload" {
  import "generic-service"
  check_command = "backup_health"
  vars.backup_test = "destino"
  vars.backup_warn = 93600   // 26 h
  vars.backup_crit = 180000   // 50 h
  assign where host.name == NodeName
}

/* Free space on the disk that holds C:\docker-backups (a 256 GB SSD with
   ~150 GB free today). Duplicati needs room for the new filesets plus the
   temporary space of a compactation. */
apply Service "Backup - Free space" {
  import "generic-service"
  check_command = "backup_health"
  vars.backup_test = "espacio"
  vars.backup_warn = 20      // GB
  vars.backup_crit = 5        // GB
  assign where host.name == NodeName
}

/* project-mirror re-syncs every 600 s and its own healthcheck already
   turns the container unhealthy at 30 min. This makes the same fact reach
   Icinga, i.e. the dashboard and the notification mail, instead of only
   showing up in `docker ps`. */
apply Service "Backup - Project mirror" {
  import "generic-service"
  check_command = "backup_health"
  vars.backup_test = "espejo"
  vars.backup_warn = 2700    // 45 min
  vars.backup_crit = 10800   // 3 h
  assign where host.name == NodeName
}

/* mysqldump rewrites dump.sql every 10 min. If that loop breaks, Duplicati
   happily keeps shipping the stale dump it finds, so nothing fails loudly
   and the "current" backup silently stops containing current data. */
apply Service "Backup - MySQL dump" {
  import "generic-service"
  check_command = "backup_health"
  vars.backup_test = "volcado"
  vars.backup_warn = 1200    // 20 min
  vars.backup_crit = 2700    // 45 min
  assign where host.name == NodeName
}

/* Duplicati's own clock. `Backup - Last upload` measures "when was the
   last copy", and verify.ps1 starts a copy every time it runs, so that
   check stays green even with the daily scheduler dead -- it would only
   tell you that someone had been pressing the button.

   What separates "it ran on time" from "it ran because someone asked" is
   Schedule.LastRun, and only the scheduler writes it: running a backup
   through the API updates Metadata.LastBackupStarted but leaves
   Schedule.LastRun untouched (verified, 7 min apart). That is the only
   signal verify.ps1 cannot fake.

   30 h / 36 h, not 26 h/50 h like `destino`: a healthy job fires every
   24 h, so anything below a full day would fire on a job that is simply
   waiting for its turn. With this PC off at 03:00 the slot never
   happens on time, Duplicati catches up on the next boot instead, and
   that is a normal run too -- what is NOT normal is not running at all. */
apply Service "Backup - Scheduled run" {
  import "generic-service"
  check_command = "backup_health"
  vars.backup_test = "programada"
  vars.backup_warn = 108000   // 30 h
  vars.backup_crit = 129600   // 36 h
  assign where host.name == NodeName
}
