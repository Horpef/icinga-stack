/*
 * Host definitions with object attributes used by the apply rules for
 * Service, Notification, Dependency and ScheduledDowntime objects.
 *
 * This file is bind-mounted over /etc/icinga2/conf.d/hosts.conf
 * (see docker-compose.yml), so the changes survive container recreation.
 *
 * Tip: Use `icinga2 object list --type Host` to list all host objects after
 * running configuration validation (`icinga2 daemon -C`).
 */

object Host NodeName {
  /* Import the default host template defined in `templates.conf`. */
  import "generic-host"

  /* Address attributes used by the ping/http/tcp checks. */
  address = "127.0.0.1"
  address6 = "::1"

  display_name = "Icinga 2 Engine (localhost)"

  /* Used by stack-monitoring.conf for service apply rules and hostgroups. */
  vars.stack_role = "monitoring"

  /*
   * NOTE: `vars.os` is intentionally NOT set here. The stock `ssh` service
   * apply rule in services.conf is gated on `vars.os == "Linux"` and there
   * is no sshd running inside this container.
   */

  /* Disk usage of the container root fs (which is the Docker host's
     overlay fs). `disk_exclude_type` has to be overridden: the ITL excludes
     `overlay` (and tmpfs, proc, ...) by default, which makes check_disk
     report "No disks were found for provided parameters" here. */
  vars.disks["disk /"] = {
    disk_partitions = "/"
    disk_exclude_type = "none"
  }

  /* Notification attributes used by the apply rules in `notifications.conf`. */
  vars.notification["mail"] = {
    /* The UserGroup `icingaadmins` is defined in `users.conf`. */
    groups = [ "icingaadmins" ]
  }

  /*
   * Load averages. The stock `load` apply rule in services.conf targets
   * NodeName and uses the ITL defaults, which are ABSOLUTE numbers
   * (-w 5,4,3 -c 10,6,4). On this 4 core host that makes
   *
   *     load15 > 4  ->  CRITICAL
   *
   * i.e. an average of barely one runnable task per core. The check indeed
   * reported CRITICAL while Windows was sitting at 13% CPU, which is exactly
   * the kind of permanent false alarm that makes a dashboard useless.
   *
   * `load_percpu` (check_load -r) divides the averages by the CPU count
   * first, so the values below are read as *per core*:
   *     warning   load > 1.5 per core   (6   on this host)
   *     critical  load > 3.0 per core   (12  on this host)
   * A host that is really saturated still alarms. Verified with the perfdata
   * of `icinga2!load`, which echoes the thresholds: load15=x;1.5;3;0;
   *
   * NOTE: host vars are the fallback for unresolved service macros, which is
   * why these live here and not in the apply rule (the stock apply rule
   * cannot be redefined without producing a duplicate service object).
   */
  vars.load_percpu = true
  vars.load_wload1 = 1.5
  vars.load_wload5 = 1.5
  vars.load_wload15 = 1.5
  vars.load_cload1 = 3.0
  vars.load_cload5 = 3.0
  vars.load_cload15 = 3.0
}
