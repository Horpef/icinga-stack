/*
 * =========================================================================
 * Wazuh 4.14.8 - manager, indexer y dashboard  (Fase 2)
 * =========================================================================
 * Bind-mounted over /etc/icinga2/conf.d/wazuh.conf (see docker-compose.yml),
 * following the pattern documented in README.md -> "Anadir otro stack".
 *
 * The three containers join `monitoring-net` as an external network and
 * keep their official service names (wazuh.manager / wazuh.indexer /
 * wazuh.dashboard). Those names are used here as `address` on purpose,
 * because they are the SAME names that appear in the TLS certificates of
 * the stack (config/certs.yml): check_http connects by `address` (-I), so
 * using the container names with hyphens (wazuh-manager) would make the
 * handshake check a name that the certificate does not carry.
 *
 * All three were probed from inside the icinga2 container before this file
 * was written, so every check below is known-good rather than hoped-for:
 *
 *   check_http -I wazuh.dashboard -S -p 5601 -u / -e 302                      -> HTTP OK
 *   check_http -I wazuh.indexer   -S -p 9200 -u /_cluster/health ...          -> HTTP OK
 *   check_http -I wazuh.manager   -S -p 55000 -u /security/user/authenticate  -> HTTP OK
 *   check_tcp  -H wazuh.manager   -p 1514 / 1515                              -> TCP OK
 *
 * Ports: only 1514, 1515, 55000 and 5601 are published on the host. The
 * indexer (9200) is deliberately NOT published, so these checks only work
 * from monitoring-net - which is exactly the reachability we care about,
 * and it keeps the search API off the host.
 *
 * ---------------------------------------------------------------------------
 * What each check really proves (and what it does not)
 * ---------------------------------------------------------------------------
 * Manager, unauthenticated probe expecting 401: the Wazuh API answers over
 * TLS AND refuses an anonymous request. A 200 here would be a *failure*
 * (someone turned authentication off), so the odd-looking "401" is the
 * healthy state. It also fails while the API is still starting, which the
 * TCP port check would miss.
 *
 * Indexer, /_cluster/health with basic auth, 200 AND the body containing
 * `green`: TLS + credentials + OpenSearch answering + cluster state. Note
 * check_http strips double quotes from the -s pattern (it looked for
 * `status:green` and reported it as such), so the pattern is the bare word
 * `green`, which in this document appears exactly once, inside
 * "status":"green". A yellow or red cluster simply has no `green` in the
 * body and goes CRITICAL.
 *
 * Dashboard on `/` expecting 302: in this very stack a 503 is what
 * OpenSearch Dashboards returns when it cannot reach the indexer (observed
 * during the first boot of Fase 2), so this single check also proves the
 * dashboard -> indexer link, not just that nginx-ish is listening.
 *
 * GAP, on purpose: nothing here watches the manager -> indexer pipeline
 * (filebeat shipping events). If it breaks, alerts stop arriving while
 * every check above stays green, because the alerts index already exists.
 * Catching that needs a body with a timestamp in it, which no stock plugin
 * can compare - the same situation that made backup/check-backups.sh
 * necessary. Candidate for a check-wazuh.sh when the first agent lands.
 */

// =========================================================================
// Hosts
// =========================================================================

object Host "wazuh-manager" {
  import "generic-host"

  display_name = "Wazuh - Manager (API, agentes, reglas)"

  /* Resolves on monitoring-net and carries CN=wazuh.manager. */
  address = "wazuh.manager"

  /* Used by the hostgroups below and by the Grafana host list. */
  vars.stack_role = "wazuh"

  /*
   * NOTE: vars.os is intentionally NOT set, so the stock `ssh` apply rule
   * (gated on vars.os == "Linux") stays out of this container, exactly as
   * for the rest of the stack.
   */

  vars.notification["mail"] = {
    groups = [ "icingaadmins" ]
  }
}

object Host "wazuh-indexer" {
  import "generic-host"

  display_name = "Wazuh - Indexer (busqueda de alertas)"
  address = "wazuh.indexer"

  vars.stack_role = "wazuh"

  /* Nothing is set for mysql_query-style vars: it is not a database with
     a port we could reach anyway - 9200 is not published on the host. */

  vars.notification["mail"] = {
    groups = [ "icingaadmins" ]
  }
}

object Host "wazuh-dashboard" {
  import "generic-host"

  display_name = "Wazuh - Dashboard"
  address = "wazuh.dashboard"

  vars.stack_role = "wazuh"

  vars.notification["mail"] = {
    groups = [ "icingaadmins" ]
  }
}

// =========================================================================
// Host group
// =========================================================================

object HostGroup "stack-wazuh" {
  display_name = "Stack - Wazuh"
  assign where host.vars.stack_role == "wazuh"
}

// =========================================================================
// Service apply rules
// =========================================================================

/* The Wazuh API without credentials. 401 is the healthy answer: it proves
   the daemon is serving AND that it is not accepting anonymous callers. */
apply Service "Wazuh Manager - API (HTTPS)" {
  import "generic-service"
  check_command = "http"
  vars.http_uri = "/security/user/authenticate"
  vars.http_port = 55000
  vars.http_ssl = true
  vars.http_expect = "401"
  vars.http_timeout = 10
  assign where host.name == "wazuh-manager"
}

/* Where agents connect. Enrollment is a separate port (1515) and a
   separate failure mode: agents keep talking on 1514 while nobody new can
   register, which would otherwise go unnoticed until the next deployment. */
apply Service "Wazuh Manager - Agentes" {
  import "generic-service"
  check_command = "tcp"
  vars.tcp_address = host.address
  vars.tcp_port = 1514
  assign where host.name == "wazuh-manager"
}

apply Service "Wazuh Manager - Alta de agentes" {
  import "generic-service"
  check_command = "tcp"
  vars.tcp_address = host.address
  vars.tcp_port = 1515
  assign where host.name == "wazuh-manager"
}

/* TLS + basic auth + OpenSearch + cluster state in one check. The timeout
   is 20 s rather than 10 s because this host is the one that showed
   15-20 s cluster-state publications during its first boot on this machine
   (HDD-backed Docker disk); 10 s would have cried wolf on every restart. */
apply Service "Wazuh Indexer - Salud del cluster" {
  import "generic-service"
  check_command = "http"
  vars.http_uri = "/_cluster/health"
  vars.http_port = 9200
  vars.http_ssl = true
  vars.http_expect = "200"
  vars.http_string = "green"
  vars.http_auth_pair = "admin:icingaadmin123"
  vars.http_timeout = 20
  assign where host.name == "wazuh-indexer"
}

/* 302 is what an unauthenticated request to `/` gets (redirect to
   /app/login), and 503 is what it gets when the dashboard has lost the
   indexer - see the header. */
apply Service "Wazuh Dashboard - Pagina de acceso" {
  import "generic-service"
  check_command = "http"
  vars.http_uri = "/"
  vars.http_port = 5601
  vars.http_ssl = true
  vars.http_expect = "302"
  vars.http_timeout = 10
  assign where host.name == "wazuh-dashboard"
}
