/*
 * =========================================================================
 * App + Oracle Database Free 23ai  (stack nuevo #2)
 * =========================================================================
 * Bind-mounted over /etc/icinga2/conf.d/oracle.conf (see docker-compose.yml),
 * following the pattern documented in README.md -> "Anadir otro stack".
 *
 * The two containers live in their own project (D:\docker\oracle-stack) and
 * join `monitoring-net` as an external network, so Icinga reaches them by the
 * compose SERVICE NAME (oracle-db / oracle-app) - the same names the app uses
 * in its own connection string. No host port is published on purpose: the
 * database and the app are internal services, and publishing them would open
 * them to the LAN for nothing.
 *
 * ---------------------------------------------------------------------------
 * What each check proves (and what it does not)
 * ---------------------------------------------------------------------------
 * Listener, plain TCP on 1521: the Oracle listener accepts a connection. It
 * is the cheapest liveness signal and it fails fast when the DB is down.
 *
 * App HTTP on 8080, expecting 200: the Flask app answers.
 *
 * The interesting one is `/health`: it runs `SELECT 1 FROM DUAL` INSIDE the
 * app, so a 200 proves the whole chain app -> listener -> PDB -> SQL engine.
 * If the database stops answering, `/health` returns 500 and this service
 * goes CRITICAL even though the app process is alive - which is exactly the
 * failure a port check cannot see. The stock `http` check is enough for it;
 * no Oracle-specific plugin (check_oracle_health, sqlplus) is needed, so the
 * Icinga container keeps its stock monitoring plugins and nothing else.
 *
 * GAP, on purpose: nothing here reads the CONTENTS of the database (row
 * counts, tablespaces, sessions). That would need an Oracle client in the
 * Icinga container or a dedicated plugin. The app's own heartbeat table is
 * the only data check, and it is exercised end to end by verify.ps1 (which
 * asks the app for the heartbeat count twice and sees it grow).
 */

// =========================================================================
// Hosts
// =========================================================================

object Host "oracle-db" {
  import "generic-host"

  display_name = "Oracle Database Free 23ai"

  /* Resolves on monitoring-net (compose service name). */
  address = "oracle-db"

  /* Used by the hostgroup below and by the Grafana host filter. */
  vars.stack_role = "oracle"

  /*
   * NOTE: vars.os is intentionally NOT set, so the stock `ssh` apply rule
   * (gated on vars.os == "Linux") stays out of this container - same as the
   * rest of the stack. The host does get the stock `ping4` service.
   */

  vars.notification["mail"] = {
    groups = [ "icingaadmins" ]
  }
}

object Host "oracle-app" {
  import "generic-host"

  display_name = "Oracle App (Flask + heartbeats)"

  address = "oracle-app"

  vars.stack_role = "oracle"

  vars.notification["mail"] = {
    groups = [ "icingaadmins" ]
  }
}

// =========================================================================
// Host group
// =========================================================================

object HostGroup "stack-oracle" {
  display_name = "Stack - Oracle app"
  assign where host.vars.stack_role == "oracle"
}

// =========================================================================
// Service apply rules
// =========================================================================

/* Oracle listener. Plain liveness: is anyone listening on 1521? */
apply Service "Oracle DB - Listener (1521)" {
  import "generic-service"
  check_command = "tcp"
  vars.tcp_address = host.address
  vars.tcp_port = 1521
  assign where host.name == "oracle-db"
}

/* The Flask app answers on 8080. */
apply Service "Oracle App - HTTP (8080)" {
  import "generic-service"
  check_command = "tcp"
  vars.tcp_address = host.address
  vars.tcp_port = 8080
  assign where host.name == "oracle-app"
}

/* End-to-end health of app + database: `/health` performs a real query, so
   this is the service that goes CRITICAL when the DB stops answering. */
apply Service "Oracle App - Salud app+BD" {
  import "generic-service"
  check_command = "http"
  vars.http_uri = "/health"
  vars.http_port = 8080
  vars.http_expect = "200"
  vars.http_string = "ok"
  vars.http_timeout = 10
  assign where host.name == "oracle-app"
}
