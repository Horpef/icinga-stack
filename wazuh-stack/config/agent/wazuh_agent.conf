<!--
============================================================================
 Agente de Wazuh del host Docker: FIM sobre la declaracion de los dos stacks
============================================================================

 OJO: SIN LA DECLARACION <?xml ...?> EN LA PRIMERA LINEA
 =======================================================
 Este fichero NO empieza con <?xml version="1.0" encoding="UTF-8"?>, y no es
 un olvido. Wazuh no usa un parser XML estandar: usa el suyo propio (os_xml,
 dentro del binario), y esa linea lo hace fallar con

     wazuh-execd: ERROR: (1226): Error reading XML file 'etc/ossec.conf'
                  (line 0).

 El detalle sale VACIO y la linea es 0, que es exactamente lo que hace
 dificil de ver: el parser no señala dónde, solo que no puede leer. El
 resultado es que ningún daemon arranca (wazuh-control status -> 5 not
 running), el agente no se da de alta nunca, `client.keys` se queda vacio y
 el healthcheck del compose (test -s client.keys) marca unhealthy para
 siempre.

 Verificado por bisect sobre el contenedor (2026-10-08), probando variantes
 con wazuh-control start/status:
   actual (con <?xml?>)          -> 5/5 daemons parados   FALLA
   sin la linea <?xml?>          -> 0/5 daemons parados   OK
   XML minimo con <?xml?>        -> 5/5 daemons parados   FALLA
   XML minimo sin <?xml?>        -> 0/5 daemons parados   OK
 O sea: el unico culpable es la declaracion; el comentario de cabecera de
 este fichero es inocente. El config del manager
 (wazuh_cluster/wazuh_manager.conf) tampoco la lleva, y por eso el manager
 arranca bien.

 COMO SE MONTA Y POR QUE ASI
 ===========================
 Este fichero se monta en /wazuh-config-mount/etc/ossec.conf, el mismo
 mecanismo que usa el manager en su propio servicio. La imagen NO lo usa en
 directo: en cada arranque lo COPIA a /var/ossec/etc/ossec.conf y DESPUES
 ejecuta sed -i sobre la COPIA, sustituyendo los marcadores CHANGE_* por las
 variables del compose (WAZUH_MANAGER_SERVER, WAZUH_AGENT_NAME, ...).

 Por eso no se monta directamente sobre /var/ossec/etc/ossec.conf: el sed -i
 acabaria escribiendo sobre el fichero de este directorio, y ademas el patron
 oficial de la imagen es exactamente este (ver /etc/cont-init.d/0-wazuh-init
 de wazuh/wazuh-agent:4.14.8).

 QUE VIGILA
 ==========
 La declaracion de los dos proyectos: compose, conf.d de Icinga, JSON de las
 copias, configuracion de servicios, certificados TLS. Es el objetivo: que
 quede registro de QUIEN cambia una linea de la infraestructura y CUANDO.

 QUE NO VIGILA (y por que)
 =========================
 * Logcollector: no hay. Los logs de los contenedores viven dentro de la VM
   de Docker y no se pueden montar desde el host Windows, y los eventos de
   Windows no llegan a ningun contenedor. Eso es lo que aportaria el agente
   MSI del host, que es el paso siguiente.
 * Escaneo realtime: no. Los bind mounts de Docker Desktop sobre Windows no
   garantizan inotify dentro del contenedor, y un realtime que no emite
   eventos seria peor que no tenerlo: daria una falsa sensacion de
   cobertura. Se barre cada hora y con scan_on_start al arrancar.

 EXCLUIDOS A PROPOSITO (sregex, no glob)
 ========================================
   .git/         un commit mueve cientos de ficheros: seria ruido puro
   _clean-test/  se crea y se borra entero en cada ensayo limpio
   /tmp/         sondas y bancos de pruebas, cambian a cada rato
   .log$         volcados de prueba y registros de las propias sondas

 OJO CON EL ATRIBUTO type: SOLO ADMITE "sregex"
 ===============================================
 El valor "regex" NO existe y hace que todo el bloque <syscheck> se rechace:

   wazuh-syscheckd: WARNING: (6679): Invalid attribute 'type' for 'ignore'
   wazuh-syscheckd: WARNING: (1202): Configuration error at 'etc/ossec.conf'
   wazuh-syscheckd: WARNING: (1207): syscheck remote configuration ...

 ... es decir, el FIM entero deja de monitorear nada, con el agente en
 "healthy" y sin que ningun otro aviso lo delate (verificado en este stack
 el 2026-10-08: era el segundo bug del agente, tras el de <?xml?>).
 Documentacion: syscheck -> ignore, "Allowed values: sregex".

 Y en sregex el punto es LITERAL (sintaxis OS Match: solo ^ $ | ! son
 especiales), por eso los patrones de arriba NO llevan barra invertida:
 `.git/` casa con `.git/` tal cual, mientras que `\.git/` buscaria una
 barra invertida literal y no casaria con nada jamas. El `$` de `.log$`
 si es especial: ancla el final de la ruta.

 La clave de este agente (client.keys) NO esta en ninguno de estos arboles:
 vive en el volumen wazuh-agent-etc, montado sobre /var/ossec/etc.
-->

<ossec_config>
  <client>
    <server>
      <address>CHANGE_MANAGER_IP</address>
      <port>CHANGE_MANAGER_PORT</port>
      <protocol>tcp</protocol>
    </server>

    <!--
      Alta automatica: un agente que arranca sin client.keys pide clave al
      manager por 1515 y el manager la concede porque su <auth> lleva
      <use_password>no</use_password>. El nombre se fija en el compose
      (WAZUH_AGENT_NAME=docker-stacks) y no depende del hostname del
      contenedor: asi, recrear el contenedor reutiliza la misma clave
      guardada en wazuh-agent-etc en vez de volver a darse de alta y chocar
      con su propia entrada anterior ("Duplicate agent name").
    -->
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>CHANGE_ENROLL_IP</manager_address>
      <port>CHANGE_ENROLL_PORT</port>
      <agent_name>CHANGE_AGENT_NAME</agent_name>
      <groups>CHANGE_AGENT_GROUP</groups>
    </enrollment>

    <notify_time>60</notify_time>
    <time-reconnect>60</time-reconnect>
    <crypto_method>aes</crypto_method>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <logging>
    <log_format>plain</log_format>
  </logging>

  <syscheck>
    <disabled>no</disabled>
    <frequency>3600</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>

    <directories check_all="yes" report_changes="yes" realtime="no">/mon/icinga-stack</directories>
    <directories check_all="yes" report_changes="yes" realtime="no">/mon/wazuh-stack</directories>

    <ignore type="sregex">.git/</ignore>
    <ignore type="sregex">_clean-test/</ignore>
    <ignore type="sregex">/tmp/</ignore>
    <ignore type="sregex">.log$</ignore>
  </syscheck>
</ossec_config>
