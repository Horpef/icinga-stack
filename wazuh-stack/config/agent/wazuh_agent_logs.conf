<!--
===========================================================================
 Agente de Wazuh de LOGS: contenedores del icinga-stack
===========================================================================

 QUE HACE
 =========
 Este agente (nombre: icinga-stacks) recoge la salida estandard (stdout)
 de TODOS los contenedores del demonio Docker leyendo los ficheros json
 que el driver json-file escribe en /var/lib/docker/containers. Es el
 complemento del agente docker-stacks: ese vigila LOS FICHEROS de ambos
 proyectos (FIM), este vigila LO QUE LOS CONTENEDORES IMPRIMEN.

 POR QUE EL MONTAJE FUNCIONA AUNQUE "ESTA DENTRO DE LA VM"
 =========================================================
 El directorio no existe en Windows: vive en el filesystem ext4 de la
 distribucion WSL de Docker Desktop. Pero el daemon que resuelve el bind
 mount es el de dentro de la VM, y ese SI lo ve. Verificado con
 `docker run -v /var/lib/docker/containers:... ls` antes de montarlo
 (2026-10-08). No hace falta compartir nada en Docker Desktop > Settings >
 Resources > File sharing.

 OJO: SIN LA DECLARACION <?xml ...?> EN LA PRIMERA LINEA
 =======================================================
 Igual que en wazuh_agent.conf: el parser os_xml de Wazuh rechaza esa
 linea y no arranca ni un daemon (ver bisect en ese fichero). Copiar esa
 leccion aqui, no reaprenderla.

 QUE NO VIGILA (y por que)
 ==========================
 * syscheck/FIM: desactivado a proposito. Los arboles de proyecto ya los
   cubre el agente docker-stacks; si ambos vigilaran /mon/icinga-stack,
   un solo cambio de fichero generaria DOS alertas (una por agente) y el
   ruido enmascaria la señal. Cada agente tiene su jurisdiccion.
 * realtime: innecesario aqui; el logcollector sigue el puntero del
   fichero en tiempo real por definicion.

 FRONTERA DE DRIVER: los contenedores de Wazuh NO se recogen (y es bueno)
 ========================================================================
 El wildcard es ciego a /var/lib/docker/containers de los contenedores
 Wazuh: su driver de log es `local` (el default de la VM de Docker
 Desktop), que escribe local-logs/container.log en formato BINARIO; solo
 existen ficheros *-json.log para driver json-file. Como el icinga-stack
 declara json-file EXPLICITO en su compose (ancla x-logging) y el
 wazuh-stack no, la frontera entre lo que se envia y lo que no es el
 TIPO DE DRIVER, no una exclusion escrita en ninguna parte. Resultado
 practico: sin bucle de retroalimentacion (el agente no se amplifica a
 si mismo) y sin ruido propio de la plataforma en los alerts.
 OJO si alguien pasa el wazuh-stack a json-file: el globo pasaria a
 recogerse a si mismo; revisar entonces reglas o driver.

 FORMATO json: que casan las reglas (y que NO)
 =============================================
 Cada linea del fichero es {"log":"...","stream":"...","time":"..."}.
 log_format="json" hace que Wazuh parsee el JSON en vez de tratar la
 linea como texto corrido; el logtest del manager lo muestra decodado
 como decoder "json" con la clave `log`. Verificado de extremo a
 extremo (2026-10-08, linea con "ERROR" inyectada -> alerta100100 en
 el indexer):
   * <match> SI VE el contenido (es case-insensitive: el patron en
     minusculas casa "ERROR"). La regla100100 del manager usa <match>
     + <decoded_as>json</decoded_as> exactamente asi.
   * <field name="log"> NO USAR: produjo
         wazuh-analysisd: ERROR: (5107): Syntax error on tag 'log'
         wazuh-analysisd: CRITICAL: (1220): Error loading the rules
     y analysisd se SALIO: el manager quedo unhealthy. Una regla mala
     no se ignora, tumba el servicio entero.
   * <hostname>wazuh-agent-icinga</hostname> NO USAR como filtro de
     alcance: pese a que el hostname del agente ES ese (verificado en
     /etc/hostname), la regla NUNCA caso con el filtro puesto ni para
     eventos json ni para syslog (bisect: quitar <hostname> -> la misma
     regla empezo a alertar al instante). El acotamiento efectivo es
     <decoded_as>json</decoded_as>.
 OJO: 'plain' NO EXISTE como log_format en <localfile> (da (1235):
 Invalid value y mata al logcollector entero; el default sin etiqueta
 es 'syslog'). Si, 'plain' SI es valido dentro de la seccion
 <logging> de este mismo fichero: son dos elementos distintos.

 LA CLAVE (client.keys) NO ESTA EN ESTE ARBOLE
 ==============================================
 Vive en el volumen wazuh-agent-icinga-etc, montado sobre /var/ossec/etc.
 Debe ser DIFERENTE del volumen del agente docker-stacks: dos agentes no
 pueden compartir client.keys.

 <syscheck> con <disabled>yes</disabled> y NO omitido: sin bloque, el
 agente aplicaria su configuracion por defecto y pasaria a vigilar /etc,
 /usr y demas del propio contenedor.
-->

<ossec_config>
  <client>
    <server>
      <address>CHANGE_MANAGER_IP</address>
      <port>CHANGE_MANAGER_PORT</port>
      <protocol>tcp</protocol>
    </server>

    <!--
      Alta automatica identica a la del agente docker-stacks: nombre fijo
      en el compose (WAZUH_AGENT_NAME=icinga-stacks), clave persistida en
      su volumen propio. Recrear el contenedor reutiliza la misma clave.
    -->
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>CHANGE_ENROLL_IP</manager_address>
      <port>CHANGE_ENROLL_PORT</port>
      <agent_name>CHANGE_AGENT_NAME</agent_name>
      <groups>CHANGE_AGENT_GROUP</groups>
    </enrollment>

    <notify_time>60</notify_time>
    <time-reconnect>60</time-reconnect>
    <crypto_method>aes</crypto_method>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <logging>
    <log_format>plain</log_format>
  </logging>

  <!--
    El logcollector (el DAEMON) sigue el puntero de cada fichero: lo que
    un contenedor imprima despues de arrancar el agente tambien se recoge,
    no solo lo que ya estaba escrito. Solo-futuro por defecto: al arrancar
    NO remonta el historial (8 MB de golpe serian innecesarios).

    OJO: la seccion XML se llama <localfile>, NO <logcollector>. El
    daemon se llama logcollector; la etiqueta, no. Poner <logcollector>
    produce exactamente esto (verificado 2026-10-08):

        wazuh-agentd: ERROR: (1230): Invalid element in the configuration: 'logcollector'.
        wazuh-agentd: ERROR: (1202): Configuration error at 'etc/ossec.conf'.
        wazuh-agentd: ERROR: (1215): No client configured. Exiting.

    El agente no arranca ni se da de alta, la salud sigue en unhealthy y
    (1230) es la unica pista del motivo. Ademas log_format va como HIJO
    de <localfile>, no como atributo de <location>, y NO hay etiqueta
    <wildcards>: el glob de location se expande solo (rechazada con
    (1230): Invalid element 'wildcards' en 4.14.8).

    El glob se re-escanea TAMBIEN EN CALIENTE: un contenedor nuevo con
    driver json-file es detectado en ~60-90 s sin reiniciar el agente
    ("(1957): New file that matches the pattern" en ossec.log,
    verificado 2026-10-08). No hace falta reiniciar al dar de alta
    contenedores. Si el contenedor NO tiene driver json-file no hay
    fichero que emparejar (ver frontera de driver mas arriba).
  -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/lib/docker/containers/*/*-json.log</location>
  </localfile>

  <syscheck>
    <disabled>yes</disabled>
  </syscheck>
</ossec_config>
